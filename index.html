<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAiNINE</title>
<style>
  :root { --bg:#05070D; --card:#0E1422; --line:#1E2A40; --text:#F2F5FA; --muted:#93A0B8; --accent:#3DF5E0; --ok:#5BE37D; --warn:#FFB347; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, system-ui, sans-serif; padding:16px 16px 40px; max-width:520px; margin-inline:auto; }
  h1 { font-size:26px; margin:4px 0 2px; letter-spacing:-0.5px; } h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:14px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  button { font:inherit; border-radius:14px; border:1px solid var(--line); background:#131B2D; color:var(--text); padding:16px 10px; font-size:18px; font-weight:600; min-height:56px; }
  button:active { transform:scale(0.98); }
  button.primary { background:var(--accent); color:#05211D; border-color:var(--accent); }
  button.small { padding:10px 12px; font-size:14px; min-height:44px; font-weight:500; }
  button:disabled { opacity:0.4; }
  .pill { font-size:13px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pill.on { color:#05211D; background:var(--ok); border-color:var(--ok); }
  .meter { height:14px; background:#0A0F1A; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .meter > div { height:100%; width:0%; background:var(--warn); transition:width .2s; }
  .label { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .big { font-size:28px; font-weight:700; }
  .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; text-align:center; }
  .stats div { background:#0A0F1A; border-radius:12px; padding:10px 4px; }
  .stats b { display:block; font-size:20px; } .stats small { color:var(--muted); font-size:12px; }
  #log { font-size:13px; color:var(--muted); max-height:220px; overflow:auto; line-height:1.6; }
  #msg { font-size:14px; color:var(--warn); min-height:20px; margin:6px 2px; }
  .heard { font-size:13px; color:var(--muted); margin-top:8px; min-height:18px; }
</style>
</head>
<body>
  <h1>CAi<span>NINE</span></h1>
  <div class="sub">Training with Lola · v0.1</div>

  <div class="card row">
    <div>
      <div class="label">Device</div>
      <span id="conn" class="pill">Not connected</span>
    </div>
    <button id="connectBtn" class="primary small">Connect</button>
  </div>
  <div id="msg"></div>

  <div class="card">
    <div class="label">Cues</div>
    <div class="grid">
      <button data-cmd="come" class="cue">Come</button>
      <button data-cmd="wait" class="cue">Wait</button>
      <button data-cmd="down" class="cue">Down</button>
      <button data-cmd="yes" class="cue primary">Yes!</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="voiceBtn" class="small">🎙 Voice: off</button>
      <button data-cmd="stop" class="cue small">Release</button>
    </div>
    <div id="heard" class="heard"></div>
  </div>

  <div class="card">
    <div class="row"><div class="label">Lola's motion</div><span id="stillPill" class="pill">—</span></div>
    <div class="meter"><div id="motionBar"></div></div>
    <div style="margin-top:12px" class="label">Wait hold</div>
    <div class="row"><div class="big" id="hold">0.0s</div><div class="label" id="goal">Goal 3s</div></div>
    <div class="meter"><div id="holdBar" style="background:var(--accent)"></div></div>
  </div>

  <div class="card stats">
    <div><b id="wins">0</b><small>Wins</small></div>
    <div><b id="tries">0</b><small>Tries</small></div>
    <div><b id="bat">–</b><small>Battery</small></div>
  </div>

  <div class="card">
    <div class="row"><div class="label">Posture: <span id="posture">calibrate first</span></div>
      <button data-cmd="cal" class="cue small">Calibrate</button></div>
    <div class="label">Calibrate while Lola stands still with the device on.</div>
  </div>

  <div class="card">
    <div class="row"><div class="label">Session log</div><button id="clearLog" class="small">Clear</button></div>
    <div id="log"></div>
  </div>

  <div class="card row">
    <button data-cmd="testtone" class="cue small">Test sound</button>
    <button data-cmd="testvib" class="cue small">Test buzz</button>
    <button data-cmd="reset" class="cue small">Reset goal</button>
  </div>

<script>
const SVC = '6e400001-ca19-4e1e-9a1e-c41a1e000001';
const CMD = '6e400002-ca19-4e1e-9a1e-c41a1e000001';
const STATE = '6e400003-ca19-4e1e-9a1e-c41a1e000001';
const $ = (id) => document.getElementById(id);
let device = null, cmdChar = null;
let log = [];
try { log = JSON.parse(localStorage.getItem('cainine_log') || '[]'); } catch (e) { log = []; }

function msg(t) { $('msg').textContent = t || ''; }
function addLog(text) {
  const t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  log.unshift(t + '  ' + text); log = log.slice(0, 300);
  try { localStorage.setItem('cainine_log', JSON.stringify(log)); } catch (e) {}
  renderLog();
}
function renderLog() { $('log').innerHTML = log.map(l => '<div>' + l.replace(/</g, '&lt;') + '</div>').join('') || 'No events yet.'; }
renderLog();

async function connect() {
  msg('');
  if (!navigator.bluetooth) { msg('Bluetooth is not available here. Open this page in the Bluefy app.'); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'CAiNINE' }], optionalServices: [SVC] });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    cmdChar = await svc.getCharacteristic(CMD);
    const st = await svc.getCharacteristic(STATE);
    st.addEventListener('characteristicvaluechanged', onState);
    await st.startNotifications();
    $('conn').textContent = 'Connected: ' + device.name; $('conn').classList.add('on');
    $('connectBtn').textContent = 'Disconnect';
    addLog('Connected to ' + device.name);
  } catch (e) { msg('Could not connect: ' + e.message); }
}
function onDisconnect() {
  cmdChar = null; $('conn').textContent = 'Not connected'; $('conn').classList.remove('on');
  $('connectBtn').textContent = 'Connect'; addLog('Disconnected');
}
$('connectBtn').onclick = () => { if (device && device.gatt.connected) device.gatt.disconnect(); else connect(); };

const names = { come: 'Come', wait: 'Wait', down: 'Down', yes: 'Yes', stop: 'Release', cal: 'Calibrated', reset: 'Goal reset', testtone: 'Test sound', testvib: 'Test buzz' };
async function send(cmd, via) {
  if (!cmdChar) { msg('Connect to the device first.'); return; }
  try {
    await cmdChar.writeValue(new TextEncoder().encode(cmd));
    addLog((names[cmd] || cmd) + (via ? ' (' + via + ')' : ''));
  } catch (e) { msg('Send failed: ' + e.message); }
}
document.querySelectorAll('.cue').forEach(b => b.onclick = () => send(b.dataset.cmd));

let lastEvt = '';
function onState(ev) {
  let s; try { s = JSON.parse(new TextDecoder().decode(ev.target.value)); } catch (e) { return; }
  const pct = Math.min(100, (s.m / 0.3) * 100);
  $('motionBar').style.width = pct + '%';
  $('motionBar').style.background = s.s ? 'var(--ok)' : 'var(--warn)';
  $('stillPill').textContent = s.s ? 'Still' : 'Moving';
  $('stillPill').classList.toggle('on', !!s.s);
  $('hold').textContent = (s.h / 1000).toFixed(1) + 's';
  $('goal').textContent = 'Goal ' + Math.round(s.g / 1000) + 's';
  $('holdBar').style.width = Math.min(100, (s.h / s.g) * 100) + '%';
  $('wins').textContent = s.ok; $('tries').textContent = s.n;
  $('bat').textContent = (s.b >= 0 ? s.b + '%' : '–');
  if (s.t >= 0) $('posture').textContent = s.p + ' (' + s.t + '°)';
  if (s.e) {
    const map = { wait_ok: 'Wait success! Goal goes up', wait_broke: 'Lola moved, hold restarted', down_ok: 'Down confirmed', down_timeout: 'Down not confirmed', calibrated: 'Posture calibrated' };
    addLog(map[s.e] || s.e);
  }
}

// ---- Voice: "Hey Lola, come / wait / down / yes / good girl / release" ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const wake = /\b(hey|hi|a)\s+(lola|lula|lowla|loler)\b/i;
const words = [
  [/\bcome\b|\bhere\b/i, 'come'], [/\bwait\b|\bstay\b/i, 'wait'], [/\bdown\b|\blay\b|\blie\b/i, 'down'],
  [/\byes\b|good girl|\bgood\b/i, 'yes'], [/\brelease\b|\bfree\b|\bokay\b|\bok\b/i, 'stop']
];
let lastVoice = 0;
function handleSpeech(text) {
  $('heard').textContent = 'Heard: "' + text + '"';
  const m = text.match(wake); if (!m) return;
  const after = text.slice(m.index + m[0].length);
  for (const [re, cmd] of words) {
    if (re.test(after)) {
      if (Date.now() - lastVoice < 1500) return;
      lastVoice = Date.now(); send(cmd, 'voice'); return;
    }
  }
}
function startVoice() {
  if (!SR) { msg('Voice commands are not supported in this browser yet. Use the buttons for now.'); return; }
  rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => { const r = e.results[e.results.length - 1]; handleSpeech(r[0].transcript); };
  rec.onerror = (e) => { if (e.error !== 'no-speech') msg('Voice error: ' + e.error); };
  rec.onend = () => { if (listening) { try { rec.start(); } catch (e) {} } };
  try { rec.start(); listening = true; $('voiceBtn').textContent = '🎙 Voice: on'; addLog('Voice on: say "Hey Lola, come"'); }
  catch (e) { msg('Could not start voice: ' + e.message); }
}
function stopVoice() { listening = false; try { rec && rec.stop(); } catch (e) {} $('voiceBtn').textContent = '🎙 Voice: off'; }
$('voiceBtn').onclick = () => listening ? stopVoice() : startVoice();
$('clearLog').onclick = () => { log = []; try { localStorage.removeItem('cainine_log'); } catch (e) {} renderLog(); };
</script>
</body>
</html>
